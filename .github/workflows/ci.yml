name: CI

# The renderer serves every school's public website, and three regressions have
# reached production from changes that a typecheck and a build both passed:
# every file in `public/` 404ing, an editor spinner cached as the page, and a
# custom domain resolving without a school slug — which told families
# "Admissions are currently closed" over an open admission.
#
# Two of those three are now covered by tests. This is what runs them.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # `npm test` runs TypeScript directly via --experimental-strip-types,
          # which needs a modern runtime.
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Reports, but does not block. `eslint` currently finds 8 pre-existing
      # errors (6 of them one React-compiler rule about setState in an effect,
      # a pattern used throughout the shared hooks). A gate that is red on the
      # day it lands gets ignored, so this stays advisory until that backlog is
      # cleared — then drop `continue-on-error` and it becomes a real gate.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # The build must not reach the network. These are the shapes the code
          # expects, not real endpoints.
          FRAPPE_URL: http://localhost:8000
          NEXT_PUBLIC_PLATFORM_DOMAIN: schools.leeep.in
          FRAPPE_BASE_DOMAIN: leeep.in
